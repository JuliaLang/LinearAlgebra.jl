name: CI
on:
  pull_request:
  push:
    branches:
      - 'master'
      - 'release-*'
    tags: '*'
concurrency:
  # Skip intermediate builds: all builds except for builds on the `main` or `release-*` branches
  # Cancel intermediate builds: only pull request builds
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.arch }}, ${{ matrix.julia-version }}${{ matrix.shard && format(', comprehensive {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    # timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Standard mode everywhere (see test/README.md).
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
          - x86
        julia-version:
          - 1.14-nightly
        exclude:
          # ubuntu x64 runs the comprehensive tests below instead
          - os: ubuntu-latest
            arch: x64
        include:
          - os: macOS-15-intel
            arch: x64
            julia-version: 1.14-nightly
          # ubuntu aarch64 also runs with forced bounds checks
          - os: ubuntu-26.04-arm
            arch: aarch64
            julia-version: 1.14-nightly
            check-bounds: 'yes'
          # macOS aarch64 also collects coverage of the code specific to Apple silicon
          - os: macOS-latest
            arch: aarch64
            julia-version: 1.14-nightly
            test-args: '--jobs=2'
            coverage: true
          # Comprehensive mode with coverage, split into two shards (see test/runtests.jl)
          - os: ubuntu-latest
            arch: x64
            julia-version: 1.14-nightly
            shard: '1/2'
            coverage: true
          - os: ubuntu-latest
            arch: x64
            julia-version: 1.14-nightly
            shard: '2/2'
            coverage: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          compiled_modules: 'existing'
          coverage: ${{ matrix.coverage == true }}
          check_bounds: ${{ matrix.check-bounds || 'auto' }}
          test_args: ${{ matrix.test-args }}
        env:
          JULIA_PRUNE_OLD_LA: 'true'
          JULIA_NUM_THREADS: 1
          LINALG_TEST_COMPREHENSIVE: ${{ matrix.shard && 'true' || 'false' }}
          LINALG_TEST_SHARD: ${{ matrix.shard }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage == true
      - uses: codecov/codecov-action@v7
        if: matrix.coverage == true
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '~1.14.0-0'
      - name: Generate docs
        run: |
          julia --color=yes --project=docs -e 'using Pkg; Pkg.instantiate()'
          julia --color=yes --project=docs --compiled-modules=existing docs/make.jl
        env:
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
