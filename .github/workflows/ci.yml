name: CI
on:
  pull_request:
  push:
    branches:
      - 'master'
      - 'release-*'
    tags: '*'
concurrency:
  # Skip intermediate builds: all builds except for builds on the `main` or `release-*` branches
  # Cancel intermediate builds: only pull request builds
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    runs-on: ${{ matrix.os }}
    # timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - macOS-latest
        julia-arch:
          - aarch64
        julia-version:
          - 'nightly'
        test-args:
          - '--jobs=1'
          - '--jobs=2'
          - '--jobs=3'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          compiled_modules: 'existing'
          test_args: ${{ matrix.test-args }}
        env:
          JULIA_PRUNE_OLD_LA: 'true'
          JULIA_NUM_THREADS: 1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'nightly'
      - name: Generate docs
        run: |
          julia --color=yes --project=docs -e 'using Pkg; Pkg.instantiate()'
          julia --color=yes --project=docs --compiled-modules=existing docs/make.jl
        env:
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
