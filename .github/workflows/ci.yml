name: CI
on:
  pull_request:
  push:
    branches:
      - 'master'
      - 'release-*'
    tags: '*'
concurrency:
  # Skip intermediate builds: all builds except for builds on the `main` or `release-*` branches
  # Cancel intermediate builds: only pull request builds
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: test (${{ matrix.config.os }}, ${{ matrix.config.arch }}, ${{ matrix.julia-version }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.config.os }}
    # timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - 'nightly'
        # Test files are split round-robin across shards (see test/runtests.jl).
        shard:
          - '1/2'
          - '2/2'
        # Coverage and forced bounds checking are only enabled on the Linux jobs;
        # the remaining jobs run with the default bounds checking and without
        # coverage instrumentation, which is considerably faster.
        config:
          - {os: ubuntu-latest, arch: x64, coverage: true, test-args: ''}
          - {os: ubuntu-latest, arch: x86, coverage: true, test-args: ''}
          - {os: windows-latest, arch: x64, coverage: false, test-args: ''}
          - {os: windows-latest, arch: x86, coverage: false, test-args: ''}
          - {os: macOS-latest, arch: aarch64, coverage: false, test-args: '--jobs=2'}
          - {os: macOS-15-intel, arch: x64, coverage: false, test-args: ''}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.config.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          compiled_modules: 'existing'
          coverage: ${{ matrix.config.coverage }}
          check_bounds: ${{ matrix.config.coverage && 'yes' || 'auto' }}
          test_args: ${{ matrix.config.test-args }}
        env:
          JULIA_PRUNE_OLD_LA: 'true'
          JULIA_NUM_THREADS: 1
          LINALG_TEST_SHARD: ${{ matrix.shard }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.config.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.config.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'nightly'
      - name: Generate docs
        run: |
          julia --color=yes --project=docs -e 'using Pkg; Pkg.instantiate()'
          julia --color=yes --project=docs --compiled-modules=existing docs/make.jl
        env:
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
